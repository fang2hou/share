name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Run quality gate and tests
        run: mise run test

  commit-history:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # mise's cocogitto plugin resolves a broken bin path on linux-x64; the
      # official action installs the release binary onto PATH
      - uses: cocogitto/cocogitto-action@v4
        with:
          install-only: true
      # PRs squash-merge, so branch commits are work-in-progress: the
      # conventional-commit contract applies to the PR title — the message
      # the squash will actually produce. cog verify needs no checkout.
      - name: Verify PR title (cog)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"
      # on main every commit is a squash of a validated PR title; check the
      # fresh commits only (depth 2, full history on a brand-new repo)
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - name: Verify pushed commits (cog)
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            cog check HEAD~1..HEAD
          else
            cog check
          fi

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [validate, commit-history]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Build and deploy the worker
        run: mise run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
